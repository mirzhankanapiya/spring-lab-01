spring:
  application:
    name: spring-lab-01
  messages:
    fallback-to-system-locale: false

server:
  port: 8080

app:
  owner: Meiirzhan Kanapiya
  group: IS-2405
  date-pattern: yyyy-MM-dd HH:mm:ss
  repeat-count: 3
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  cache:
    ttl: 10m
    max-entries: 1000

logging:
  level:
    web: INFO
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
  endpoint:
    env:
      show-values: ALWAYS
    configprops:
      show-values: ALWAYS